name: Render 24/7 Keep-Alive Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping O-Band Render Server
        run: |
          curl -s -L -A "Mozilla/5.0 O-Band-GitHub-KeepAlive/2.0" "https://o-band.onrender.com/api/health?src=gh_actions&t=$(date +%s)" || true
