<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.6"/>
  
  <!-- Guitar Silhouette / Symbol -->
  <g transform="translate(256, 210) scale(1.1)" filter="url(#glow)">
    <!-- Guitar Body -->
    <path d="M-40,20 C-90,50 -90,110 -40,150 C-10,170 30,170 60,140 C100,100 90,50 40,20 C60,-10 50,-50 20,-70 C-10,-50 -20,-10 -40,20 Z" fill="url(#neonGrad)"/>
    <!-- Guitar Neck -->
    <rect x="-10" y="-190" width="20" height="130" rx="4" fill="#f8fafc"/>
    <!-- Guitar Headstock -->
    <path d="M-14,-190 L-18,-240 L18,-240 L14,-190 Z" fill="url(#neonGrad)"/>
    <!-- Sound Hole -->
    <circle cx="10" cy="80" r="24" fill="#0f111a"/>
  </g>

  <!-- Brand Text -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="2">오뺀</text>
  <text x="256" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="700" font-size="22" fill="#c084fc" letter-spacing="4">BAND CLUB</text>
</svg>
